# Schema: itr / dmpl
# Demonstração das Mutações do Patrimônio Líquido — ITR trimestral.
# 16 colunas (a mais é COLUNA_DF, que carrega os "componentes do PL"
# como Capital Social Integralizado, Reservas de Lucro, etc.). A CVM já
# entrega DMPL em long format — sem necessidade de pivotação.

dataset: itr
table: dmpl

cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ITR/DADOS/itr_cia_aberta_{year}.zip"
cvm_file_url_pattern: null

cvm_file_pattern_variants:
  ind: "itr_cia_aberta_DMPL_ind_{year}.csv"
  con: "itr_cia_aberta_DMPL_con_{year}.csv"

cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ITR/META/meta_itr_cia_aberta_txt.zip#meta_itr_cia_aberta_DMPL.txt"

encoding: ISO-8859-1
delimiter: ";"

temporal_partitioning: yearly
first_year: 2011

expected_field_count: 16

transformations:
  - column: vl_conta
    action: multiply_by_scale
    scale_column: escala_moeda
  - column: escala_moeda
    action: drop
  - action: keep_latest_version
