# Schema: itr / bpa
# Balanço Patrimonial Ativo — ITR trimestral.
# Variantes individual (`ind`) e consolidada (`con`), selecionadas pelo
# argumento `report_type` em cvm_fetch(). META oficial cobre ambos.
# Estruturalmente idêntico ao dfp/bpa (14 campos), difere apenas pela
# periodicidade trimestral.

dataset: itr
table: bpa

# Download topology -------------------------------------------------------
cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ITR/DADOS/itr_cia_aberta_{year}.zip"
cvm_file_url_pattern: null

# Variantes ind/con. cvm_fetch() escolhe um destes via report_type.
cvm_file_pattern_variants:
  ind: "itr_cia_aberta_BPA_ind_{year}.csv"
  con: "itr_cia_aberta_BPA_con_{year}.csv"

# Dictionary --------------------------------------------------------------
cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ITR/META/meta_itr_cia_aberta_txt.zip#meta_itr_cia_aberta_BPA.txt"

# Reader settings ---------------------------------------------------------
encoding: ISO-8859-1
delimiter: ";"

# Temporal coverage -------------------------------------------------------
temporal_partitioning: yearly
first_year: 2011

# Field count (validation aid) --------------------------------------------
expected_field_count: 14

# Transformations ---------------------------------------------------------
transformations:
  - column: vl_conta
    action: multiply_by_scale
    scale_column: escala_moeda
    note: >-
      VL_CONTA vem na escala de ESCALA_MOEDA. Multiplicado por UNIDADE=1,
      MIL=1e3, MILHÃO=1e6 ou BILHÃO=1e9 para retornar em reais absolutos.
  - column: escala_moeda
    action: drop
    note: Removida após ser internalizada em vl_conta.
  - action: keep_latest_version
    note: >-
      Mantém apenas o registro de maior VERSAO por (cnpj_cia, dt_refer).
      Em ITR, dt_refer identifica o trimestre.
