# Schema: fre / mercado_estrangeiro
# FRE detail table. Detail tables usam convencao cnpj_companhia /
# data_referencia / nome_companhia (CLAUDE.md Sec.2.2).
# Empirical verification: 2024 snapshot.
#
# 2026: the CSV is NOT in fre_cia_aberta_2026.zip (34 CSVs; the other
# 34 package tables are there), while the CVM's data dictionary still
# lists it and Res. CVM 80, Anexo C, item 12.6 (ex-18.7) still asks for
# the data. Rows had already thinned: 119 (72 companies) in 2024, 11 (10
# companies) in 2025. Read as a CVM export failure, not a rule change,
# so no `empty_from` here (measured 2026-10-25; reported to the CVM).
# The mirror's skip manifest records 2026 as "absent".

dataset: fre
table: mercado_estrangeiro

# Download topology -----------------------------------------------------
cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FRE/DADOS/fre_cia_aberta_{year}.zip"
cvm_file_url_pattern: null
cvm_file_pattern: "fre_cia_aberta_mercado_estrangeiro_{year}.csv"

# Dictionary ------------------------------------------------------------
cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FRE/META/meta_fre_cia_aberta.zip#meta_fre_cia_aberta_mercado_estrangeiro.txt"

# Reader settings -------------------------------------------------------
encoding: ISO-8859-1
delimiter: ";"

# Temporal coverage -----------------------------------------------------
temporal_partitioning: yearly
# The table is absent from the CVM's fre_cia_aberta_<year>.zip before 2019
# (declared 2010 until 2026-10-21; measured on the mirror's inventory and
# confirmed in the ZIP members). cvm_fetch() refuses earlier years upfront.
first_year: 2019
# Field count (validation aid) -----------------------------------------
expected_field_count: 17

# Transformations ------------------------------------------------------
transformations:
  - action: keep_latest_version
    note: Mantem apenas a ultima entrega (data de recebimento, id, VERSAO) por (cnpj_companhia, data_referencia).
