# Schema: dfp / composicao_capital
# Composição do Capital Social. Layout wide: uma linha por
# (cnpj_cia, dt_refer, versao), com 6 colunas de quantidades de ações
# (ordinárias + preferenciais + total, capital integralizado + tesouraria).
# Sem variantes ind/con — companhia tem uma composição apenas.
# Sem multiplicação por escala_moeda — valores são quantidades de ações,
# não valores monetários.

dataset: dfp
table: composicao_capital

cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/DADOS/dfp_cia_aberta_{year}.zip"
cvm_file_url_pattern: null
cvm_file_pattern: "dfp_cia_aberta_composicao_capital_{year}.csv"

cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/META/meta_dfp_cia_aberta_txt.zip#meta_dfp_cia_aberta_composicao_capital.txt"

encoding: ISO-8859-1
delimiter: ";"

temporal_partitioning: yearly
# The table is absent from the CVM's dfp_cia_aberta_<year>.zip before 2020
# (declared 2010 until 2026-10-21; measured on the mirror's inventory and
# confirmed in the ZIP members). cvm_fetch() refuses earlier years upfront.
first_year: 2020
expected_field_count: 10

transformations:
  - action: keep_latest_version
