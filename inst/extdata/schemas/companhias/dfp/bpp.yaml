# Schema: dfp / bpp
# Balanço Patrimonial Passivo — DFP anual.
# Mesmo schema do bpa: 14 colunas, ind/con, escala_moeda.

dataset: dfp
table: bpp

cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/DADOS/dfp_cia_aberta_{year}.zip"
cvm_file_url_pattern: null

cvm_file_pattern_variants:
  ind: "dfp_cia_aberta_BPP_ind_{year}.csv"
  con: "dfp_cia_aberta_BPP_con_{year}.csv"

cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/META/meta_dfp_cia_aberta_txt.zip#meta_dfp_cia_aberta_BPP.txt"

encoding: ISO-8859-1
delimiter: ";"

temporal_partitioning: yearly
first_year: 2010

expected_field_count: 14

transformations:
  - column: vl_conta
    action: multiply_by_scale
    scale_column: escala_moeda
  - column: escala_moeda
    action: drop
  - action: keep_latest_version
