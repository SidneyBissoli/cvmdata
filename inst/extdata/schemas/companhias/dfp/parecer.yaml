# Schema: dfp / parecer
# Pareceres dos auditores independentes e declarações dos diretores
# sobre as demonstrações. Texto livre — quatro tipos de relato:
# declarações de diretores sobre DFs, sobre relatório de auditor, e
# parecer do conselho fiscal.
# Sem variantes ind/con, sem multiplicação por escala.

dataset: dfp
table: parecer

cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/DADOS/dfp_cia_aberta_{year}.zip"
cvm_file_url_pattern: null
cvm_file_pattern: "dfp_cia_aberta_parecer_{year}.csv"

cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/META/meta_dfp_cia_aberta_txt.zip#meta_dfp_cia_aberta_parecer.txt"

encoding: ISO-8859-1
delimiter: ";"

temporal_partitioning: yearly
first_year: 2010

expected_field_count: 8

transformations:
  - action: keep_latest_version
