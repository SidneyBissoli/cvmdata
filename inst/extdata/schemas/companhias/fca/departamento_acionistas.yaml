# Schema: fca / departamento_acionistas
# Dados de contato do departamento de acionistas declarados no
# Formulario Cadastral. Convencao FRE-detail (cnpj_companhia /
# data_referencia / nome_empresarial).
#
# IMPORTANT: this table is published with a valid 23-field header but
# ZERO data rows from 2024 onward (546 rows in 2023, 721 in 2022). The
# block was not moved elsewhere: item 6 of the Formulario Cadastral
# ("Departamento de acionistas") was REVOKED by Resolucao CVM 59/2021,
# art. 8, II (with items 1.28, 1.29, 5.8 and 5.9), in force since
# 2023-01-02 (art. 9). The 2023 filings still carried it in part (64%
# of the companies, old template); from the 2024 cycle on, none. The
# CVM keeps publishing the CSV every year, header only. The reader must
# tolerate a header-only CSV without aborting (nrow == 0L is valid);
# `empty_from` below lets the package say why (measured 2026-10-24 on
# the 2020-2026 ZIPs and on the consolidated text of Res. CVM 59).

dataset: fca
table: departamento_acionistas

# Download topology -----------------------------------------------------
cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FCA/DADOS/fca_cia_aberta_{year}.zip"
cvm_file_url_pattern: null
cvm_file_pattern: "fca_cia_aberta_departamento_acionistas_{year}.csv"

# Dictionary ------------------------------------------------------------
cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FCA/META/fca_cia_aberta.zip#meta_fca_cia_aberta_departamento_acionistas.txt"

# Reader settings -------------------------------------------------------
encoding: ISO-8859-1
delimiter: ";"

# Temporal coverage -----------------------------------------------------
temporal_partitioning: yearly
first_year: 2010
# The CVM publishes this table's CSV every year but, from `empty_from`
# on, with the header only. The package refuses those years (as it
# refuses years before `first_year`) and warns when `year = NULL`
# resolves against them. `empty_reason` is quoted in those messages.
empty_from: 2024
empty_reason: >-
  item 6 of the Formulario Cadastral (shareholders department) was
  revoked by Resolucao CVM 59/2021, in force since 2023-01-02

# Field count (validation aid) -----------------------------------------
# 23 fields are declared by the META and present in the CSV header even
# in years where the table carries no data rows.
expected_field_count: 23

# Transformations ------------------------------------------------------
transformations:
  - action: keep_latest_version
    note: >-
      Mantem apenas a ultima entrega (data de recebimento, id, VERSAO) por (cnpj_companhia, data_referencia).
      No-op em anos onde a tabela vem vazia (so cabecalho).
