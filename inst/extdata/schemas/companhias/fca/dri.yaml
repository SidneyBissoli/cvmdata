# Schema: fca / dri
# Diretor de Relacoes com Investidores: dados de contato declarados no
# Formulario Cadastral. Convencao FRE-detail (cnpj_companhia /
# data_referencia / nome_empresarial). Traz CPF_Responsavel (forcado a
# character pelo reader). Empirical verification: 2024 snapshot
# (verificacao empirica v0.2 §2.1).

dataset: fca
table: dri

# Download topology -----------------------------------------------------
cvm_archive_url_pattern: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FCA/DADOS/fca_cia_aberta_{year}.zip"
cvm_file_url_pattern: null
cvm_file_pattern: "fca_cia_aberta_dri_{year}.csv"

# Dictionary ------------------------------------------------------------
cvm_dictionary_url: "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FCA/META/fca_cia_aberta.zip#meta_fca_cia_aberta_dri.txt"

# Reader settings -------------------------------------------------------
encoding: ISO-8859-1
delimiter: ";"

# Temporal coverage -----------------------------------------------------
temporal_partitioning: yearly
first_year: 2016

# Field count (validation aid) -----------------------------------------
expected_field_count: 26

# Transformations ------------------------------------------------------
transformations:
  - action: keep_latest_version
    note: >-
      Mantem apenas a maior VERSAO por (cnpj_companhia, data_referencia).
