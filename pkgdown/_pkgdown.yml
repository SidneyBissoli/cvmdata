url: https://sidneybissoli.github.io/cvmdata/

template:
  bootstrap: 5

articles:
  - title: Get started
    navbar: ~
    contents:
      - cvmdata
  - title: Deep dives
    navbar: Deep dives
    contents:
      - matches("^articles/getting-started$")
      - matches("^articles/groups-overview$")
      - matches("^articles/issuer-fetch$")
      - matches("^articles/itr-dfp$")
      - matches("^articles/fre$")
      - matches("^articles/ipe-vlmo$")
      - matches("^articles/cache-and-mirror$")
      - matches("^articles/data-defects$")

reference:
  - title: Fetchers
    desc: >
      Five functions to retrieve any CVM open-data table covered by
      the package. v0.1.0.9000 ships only `issuer_fetch()` as
      functional; `fund_fetch()`, `agent_fetch()`,
      `offering_fetch()` and `event_fetch()` are exported as
      skeletons documenting the planned v0.4-v0.8 contracts
      (calling them aborts with `cvmdata_error_input_group`).
    contents:
      - issuer_fetch
      - fund_fetch
      - agent_fetch
      - offering_fetch
      - event_fetch
  - title: Cache
    desc: >
      Inspect and manage the on-disk cache of downloaded artifacts.
      The TTL window for HTTP revalidation is configurable via the
      `cvmdata.cache_ttl_seconds` option (default 30 days).
    contents:
      - cvm_cache_path
      - cvm_cache_set_path
      - cvm_cache_info
      - cvm_cache_clear
  - title: Source backend
    desc: >
      Configure which backend `issuer_fetch()` queries (direct CVM
      portal or the parquet mirror published in GitHub Releases).
    contents:
      - cvm_source_get
      - cvm_source_set
  - title: Discovery
    desc: >
      Browse the CKAN groups, datasets, tables, dictionaries and
      code lists carried by the package. `cvm_groups()` is the
      entry point that lists every group covered by the project
      roadmap (only `companhias` is functionally implemented in
      v0.1.0.9000); the remaining functions accept an optional
      `group` argument that disambiguates when a dataset slug occurs
      in more than one group.
    contents:
      - cvm_groups
      - cvm_datasets
      - cvm_tables
      - cvm_dictionary
      - cvm_codelist
      - cvm_dataset_years
  - title: Utilities
    desc: CNPJ formatting helpers.
    contents:
      - cnpj_clean
      - cnpj_format
