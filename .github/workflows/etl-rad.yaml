name: ETL RAD history

# Recovers the superseded DFP/ITR filings from the CVM RAD and appends
# them to the history assets of the mirror releases (Part 3b of the
# versions work, decisions of 2026-10-20; see inst/etl/04-rad-fetch.R).
#
# Triggers:
#   - schedule: daily 02:00 UTC (23:00 BRT). Both robots append to the
#     same history assets, so this workflow and etl-mirror.yaml share
#     the concurrency group `etl-history`: a run of one waits for the
#     other to finish. The cron alone does not keep them apart: with
#     `dfp` and `itr` in series a run lasts up to twice `timeout-minutes`
#     (12:00 UTC), past the Tuesday 07:00 UTC run of the mirror.
#   - workflow_dispatch: `dataset` (empty = dfp then itr, as the cron),
#     `limit` (documents per dataset, default 300), `year` (one
#     reference year, smoke test), `reread` (id_doc to read again, their
#     history rows replaced: a document read wrong before a reader fix),
#     `dry_run` (read, do not publish).
#
# One job per dataset, DFP first (decision 3: most recent year first,
# DFP before ITR). Each document costs ~40–50 s (download, reading and
# a 10 s crawl delay; measured 2026-10-22: 200 documents in 2 h 56);
# 300 documents are ~4 h. A refusal by the RAD (403 or an HTML body)
# is retried after a 90 s pause, twice, before it counts: a document
# refused every time stops the run, and so does a reader failing on
# more than ~10% of the documents once 50 were attempted (download
# errors and documents set aside for what they are do not count;
# decision of 2026-10-23). Both exit with status 2 after publishing
# what was read, which turns the job red: the portfolio monitor
# watches this workflow and the public `__rad_unread.csv` asset.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset (`both` runs dfp then itr, as the cron)
        required: false
        default: both
        type: choice
        options:
          - both
          - dfp
          - itr
      limit:
        description: Documents per dataset in this run
        required: false
        default: '300'
        type: string
      year:
        description: Reference year (optional; smoke test, one year only)
        required: false
        type: string
      reread:
        description: Read these id_doc again and replace their history rows (comma-separated; one dataset)
        required: false
        type: string
      dry_run:
        description: Read the documents but do not publish
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # gh release upload

concurrency:
  # Shared with etl-mirror.yaml (same history assets); see the header.
  group: etl-history
  cancel-in-progress: false

jobs:
  rad:
    runs-on: ubuntu-latest
    # The script stops starting new downloads after --minutes (default
    # 260) and publishes what it has; the 40 min on top cover the R
    # setup, the last document (up to two 90 s WAF pauses) and the last
    # checkpoint. Raised from 200 on 2026-10-23: a 200-document lot took
    # 2 h 56 clean and overran 200 min with the WAF pauses.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dataset: ${{ (github.event_name == 'schedule' || inputs.dataset == 'both') && fromJSON('["dfp","itr"]') || fromJSON(format('["{0}"]', inputs.dataset)) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CVMDATA_ETL_WORKSPACE: /tmp/cvmdata-etl
    steps:
      - uses: actions/checkout@v7

      # The setup steps take 20-80 s when the Ubuntu apt mirror of the
      # runners answers; on 2026-10-23 it crawled and they hung for hours
      # (azure.archive.ubuntu.com). Past the deadline the job fails fast
      # and is re-run, instead of holding the PR.
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 10
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          extra-packages: any::arrow, any::devtools, any::digest, any::dplyr, any::jsonlite, any::xml2
          needs: check

      - name: Install cvmdata from source
        run: Rscript -e 'devtools::install(quick = TRUE, upgrade = FALSE)'

      - name: Stage 04 — RAD history
        run: |
          args="--group companhias --dataset ${{ matrix.dataset }}"
          args="$args --limit ${{ inputs.limit || '300' }}"
          if [ -n "${{ inputs.year }}" ]; then
            args="$args --year ${{ inputs.year }}"
          fi
          if [ -n "${{ inputs.reread }}" ]; then
            args="$args --reread ${{ inputs.reread }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          # shellcheck disable=SC2086
          Rscript inst/etl/04-rad-fetch.R $args

      - name: Upload the unread list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rad-unread-${{ matrix.dataset }}
          path: ${{ env.CVMDATA_ETL_WORKSPACE }}/out/rad/companhias/${{ matrix.dataset }}/__rad_unread.csv
          if-no-files-found: ignore
