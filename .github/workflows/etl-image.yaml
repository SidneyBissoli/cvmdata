# Build, test and publish the environment of the ETL robots
# (.github/etl-image/Dockerfile), and hand its digest to them.
#
# Since 2026-11-18 the robots (etl-mirror, etl-rad, zenodo-edition) run
# inside this image instead of rebuilding R and its libraries from the apt
# mirror, P3M and setup-r on every run: a slow mirror used to fail the job
# before the robot started (2026-10-23, 2026-10-27 twice, 2026-11-18).
#
# The tag is a hash of everything that defines the environment: the
# Dockerfile, the smoke test, the dependency fields of DESCRIPTION and the
# packages inst/etl calls (`pkg::`). Same inputs, same tag: the image is
# built once, and every robot run after that only resolves the tag to its
# digest (a registry lookup, seconds). A change in any input is a new tag,
# built and tested
#   - on the pull request that makes the change (build + smoke, no push),
#   - on the push to main (build + smoke + push + provenance attestation),
#   - and, as a last resort, by the robot run itself through workflow_call
#     when the tag is still missing (self-healing: no manual step between
#     a merge and the next scheduled run).
# The robots run the image BY DIGEST, never by tag.

name: ETL image

on:
  workflow_call:
    outputs:
      image:
        description: "The image by digest (ghcr.io/...@sha256:...)"
        value: ${{ jobs.image.outputs.image }}
  pull_request:
    paths:
      - ".github/etl-image/**"
      - ".github/workflows/etl-image.yaml"
      - "DESCRIPTION"
      - "inst/etl/**"
  push:
    branches: [main]
    paths:
      - ".github/etl-image/**"
      - ".github/workflows/etl-image.yaml"
      - "DESCRIPTION"
      - "inst/etl/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # push to ghcr.io
  id-token: write      # provenance attestation
  attestations: write  # provenance attestation

jobs:
  image:
    runs-on: ubuntu-24.04
    # A build is ~10 min; the lookup alone, seconds.
    timeout-minutes: 60
    outputs:
      image: ${{ steps.out.outputs.image }}
    env:
      IMAGE: ghcr.io/sidneybissoli/cvmdata-etl
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag from the inputs
        id: tag
        run: |
          set -euo pipefail
          {
            cat .github/etl-image/Dockerfile .github/etl-image/smoke.R
            awk '/^(Depends|Imports|LinkingTo):/ {f = 1; print; next}
                 /^[A-Za-z@\/]+:/ {f = 0} f' DESCRIPTION
            sed 's/#.*//' inst/etl/*.R |
              grep -oP '\b[A-Za-z][A-Za-z0-9.]*(?=::)' | sort -u
          } | sha256sum | cut -c1-16 > /tmp/tag
          echo "tag=$(cat /tmp/tag)" >> "$GITHUB_OUTPUT"
          echo "inputs hash: $(cat /tmp/tag)"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already built?
        id: have
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" \
                        --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) \
             && [ -n "$digest" ] && [ "$digest" != "null" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG already built: $digest"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$TAG not built yet"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.have.outputs.exists != 'true'

      # Loaded into the runner first: nothing is pushed before the smoke
      # test passes inside the image.
      - name: Build
        if: steps.have.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/etl-image/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=etl-image
          cache-to: type=gha,scope=etl-image,mode=max

      - name: Smoke test inside the image
        if: steps.have.outputs.exists != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE:$TAG" \
            Rscript /opt/cvmdata-etl/smoke.R

      - name: Push
        id: push
        if: steps.have.outputs.exists != 'true' && env.PUSH == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" \
                     --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE:$TAG as $digest"

      - uses: actions/attest-build-provenance@v4
        if: steps.push.outcome == 'success'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Image by digest
        id: out
        env:
          HAVE: ${{ steps.have.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          digest="${HAVE:-$PUSHED}"
          if [ -n "$digest" ]; then
            echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
            echo "image: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "built and tested, not pushed (pull request)" >> "$GITHUB_STEP_SUMMARY"
          fi
