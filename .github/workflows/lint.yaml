# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    # the ubuntu job of the current R release runs in the portfolio's CI
    # image (SidneyBissoli/r-ci): R, pandoc and every dependency are already
    # there, nothing is installed through the apt mirror at job time
    container: ghcr.io/sidneybissoli/r-ci:latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # covers a dependency the package gained after the last image build;
      # with everything already installed it takes seconds
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 15
        with:
          cache: false
          extra-packages: any::lintr, any::cyclocomp, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
