name: ETL mirror retry

# Re-runs the failed jobs of an "ETL mirror" run on a fresh runner.
#
# Why this exists: of the 14 scheduled mirror runs between 2026-06-09
# and 2026-09-08, 8 went red, every one of them in "Stage 01 — fetch
# CVM", with a different (group, dataset) each week — the whole job
# unable to open a TCP connection to dados.cvm.gov.br while its
# siblings, on other runners, downloaded normally. Measured on
# 2026-09-11 from eight runners in parallel: the portal answers in
# ~0,15 s over IPv4, the runners carry no IPv6 route, and the egress IP
# differs on every job (172.x, 20.x, 64.x, 135.x, 57.x, 104.x, 74.x,
# 9.x). So the failure is the portal dropping some Azure egress IPs for
# a while, and the cure is another IP: a re-run of the failed job alone.
#
# `gh run rerun --failed` re-runs only the jobs that failed, each one
# landing on a new runner. The attempt guard caps it at 3 attempts
# total, because every attempt fires this workflow again.
#
# The wait is there for the other shape of the outage — the portal
# itself under load — and costs nothing on a public repo.

on:
  workflow_run:
    workflows: ["ETL mirror"]
    types: [completed]

permissions:
  actions: write  # gh run rerun

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait, then re-run the failed jobs on a new runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          echo "run $RUN_ID failed on attempt $ATTEMPT; waiting 10 min"
          sleep 600
          # Belt to the job-level `if`. That guard reads the attempt out
          # of the event payload, and a GitHub expression coerces an
          # absent field to 0 — which would compare as "< 3" forever and
          # turn a genuine, reproducible failure into an endless retry
          # loop. So ask the API for the attempt the run is actually on,
          # right before firing, and refuse from the live number.
          live=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '.run_attempt')
          case "$live" in
            ''|*[!0-9]*)
              echo "could not read run_attempt (got '$live'); refusing" >&2
              exit 1
              ;;
          esac
          if [ "$live" -ge 3 ]; then
            echo "run $RUN_ID is already on attempt $live; giving up"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed -R "${{ github.repository }}"
          echo "re-run requested for the failed jobs of $RUN_ID"
