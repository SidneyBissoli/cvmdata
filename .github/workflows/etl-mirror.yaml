name: ETL mirror

# Publishes the parquet mirror to GitHub Releases.
#
# Triggers:
#   - schedule: weekly Tuesday 04:00 BRT (07:00 UTC). Runs the full v0.1
#     (group, dataset) matrix in parallel.
#   - workflow_dispatch: manual trigger; leave `dataset` empty to expand
#     to the full matrix (same path as the cron), or pick one
#     `(group, dataset)` pair for a single-pair run. `year` (optional)
#     scopes to a single year for smoke testing.
#
# The matrix uses fail-fast: false so a single (group, dataset) failure
# does not kill the rest of the week.
#
# 03-publish.R compares the SHA-256 of the CVM META files against the
# `__source_hash.json` asset of the previous release and skips publishing
# when nothing changed upstream.
#
# Sessao 08 (v0.1.0.9000): added the `<group>` segment to release tags
# (`mirror-<group>-<dataset>-latest`) and to the local parquet layout
# (`<workspace>/out/parquet/<group>/<dataset>/...`). All four scripts
# now require both `--group` and `--dataset`.

on:
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:
    inputs:
      group:
        description: CKAN group slug (leave empty for the full v0.1 matrix)
        required: false
        type: choice
        options:
          - ''
          - companhias
      dataset:
        description: Dataset id (must be paired with `group`; leave empty for the full matrix)
        required: false
        type: choice
        options:
          - ''
          - cad
          - dfp
          - itr
          - fre
          - cgvn
          - vlmo
          - fca
      year:
        description: Year (optional, default = all published)
        required: false
        type: string

permissions:
  contents: write  # gh release create/delete/upload

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Schedule triggers and "empty input" manual dispatches expand
        # to the full (group, dataset) matrix; otherwise we run the
        # single chosen pair. The full matrix is encoded as a JSON
        # array of {group, dataset} objects so GitHub's matrix engine
        # iterates over both fields together.
        include: ${{ (github.event_name == 'schedule' || inputs.dataset == '') && fromJSON('[{"group":"companhias","dataset":"cad"},{"group":"companhias","dataset":"dfp"},{"group":"companhias","dataset":"itr"},{"group":"companhias","dataset":"fre"},{"group":"companhias","dataset":"cgvn"},{"group":"companhias","dataset":"vlmo"},{"group":"companhias","dataset":"fca"}]') || fromJSON(format('[{{"group":"{0}","dataset":"{1}"}}]', inputs.group, inputs.dataset)) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # runner.* contexts are not allowed at job-level env, only inside
      # steps. Hardcoding /tmp works on ubuntu-latest and keeps the env
      # readable across all stages without per-step duplication.
      CVMDATA_ETL_WORKSPACE: /tmp/cvmdata-etl
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::arrow, any::devtools, any::digest, any::jsonlite, any::pointblank
          needs: check

      - name: Install cvmdata from source
        # `upgrade = "never"` worked on older devtools; current devtools
        # accepts only TRUE/FALSE/NA.
        run: Rscript -e 'devtools::install(quick = TRUE, upgrade = FALSE)'

      - name: Stage 01 — fetch CVM
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            Rscript inst/etl/01-fetch-cvm.R \
              --group ${{ matrix.group }} \
              --dataset ${{ matrix.dataset }} \
              --year ${{ inputs.year }}
          else
            Rscript inst/etl/01-fetch-cvm.R \
              --group ${{ matrix.group }} \
              --dataset ${{ matrix.dataset }}
          fi

      - name: Stage 02 — CSV to parquet
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            Rscript inst/etl/02-csv-to-parquet.R \
              --group ${{ matrix.group }} \
              --dataset ${{ matrix.dataset }} \
              --year ${{ inputs.year }}
          else
            Rscript inst/etl/02-csv-to-parquet.R \
              --group ${{ matrix.group }} \
              --dataset ${{ matrix.dataset }}
          fi

      - name: Stage 02b — validate parquets
        # Hybrid checks (Sessao 3.14 decisions 1 & 2): structural
        # failures exit 1 and block publish; content warnings are
        # logged. Report file is uploaded as an artifact below for
        # post-hoc inspection regardless of outcome.
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            Rscript inst/etl/02b-validate.R \
              --group ${{ matrix.group }} \
              --dataset ${{ matrix.dataset }} \
              --year ${{ inputs.year }}
          else
            Rscript inst/etl/02b-validate.R \
              --group ${{ matrix.group }} \
              --dataset ${{ matrix.dataset }}
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.group }}-${{ matrix.dataset }}
          path: ${{ env.CVMDATA_ETL_WORKSPACE }}/out/validation/${{ matrix.dataset }}.md
          if-no-files-found: ignore

      - name: Stage 03 — publish to GitHub Releases
        run: |
          Rscript inst/etl/03-publish.R \
            --group ${{ matrix.group }} \
            --dataset ${{ matrix.dataset }}
